# IXTIYORIY: PostgreSQL'ni Docker orqali ishga tushirish (kompyuterda PostgreSQL o'rnatilmagan bo'lsa).
# Ishga tushirish:  docker compose up -d
# Shunda backend/.env dagi DATABASE_URL:
#   postgresql+psycopg://postgres:postgres123@127.0.0.1:5432/task_db
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: task_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_db"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
